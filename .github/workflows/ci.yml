name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Golden benchmark (must stay at 100%)
        env:
          RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: |
          python scripts/run_benchmarks.py
          python -c "import json,os; d=json.load(open(os.path.join(os.environ['RUNTIME_DIR'],'latest_benchmark.json'))); print(d['passed_cases'],'/',d['total_cases']); assert d['failed_cases']==0"

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t evals:ci .
      - run: docker run -d --name evals -p 8000:8000 evals:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' evals)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs evals; exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          q() { curl -fsS -X POST http://127.0.0.1:8000/api/query -H 'content-type: application/json' -d "$1"; }
          ok=$(q '{"user_id":"architect_1","query":"How are traces logged and replayed?"}')
          echo "$ok"; echo "$ok" | grep -q '"status":"approved"'
          denied=$(q '{"user_id":"viewer_1","query":"Delete the trace store"}')
          echo "$denied"; echo "$denied" | grep -q '"status":"denied"'
          curl -fsS -X POST http://127.0.0.1:8000/api/benchmarks/run | python -c "import sys,json; d=json.load(sys.stdin); print(d['accuracy']); assert d['failed_cases']==0"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
      - run: test "$(docker exec evals id -u)" = "10001"
      - if: failure()
        run: docker logs evals
